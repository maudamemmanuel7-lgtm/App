
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACOAC - Change Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f5f9;
            padding: 20px;
        }

        .password-container {
            width: 100%;
            max-width: 480px;
        }

        .school-brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .school-brand h1 {
            color: #142b50;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .school-brand span {
            color: #c9a227;
        }

        .school-brand p {
            color: #718096;
            font-size: 14px;
        }

        .password-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #c9a227;
        }

        .card-icon {
            width: 55px;
            height: 55px;
            background: #edf2f8;
            color: #142b50;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 20px;
        }

        .password-card h2 {
            color: #142b50;
            font-size: 23px;
            margin-bottom: 9px;
        }

        .description {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #26374d;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dce2eb;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #c9a227;
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.12);
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: #142b50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .submit-button:hover {
            background: #c9a227;
            color: #142b50;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #142b50;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            color: #c9a227;
        }

        .security-note {
            text-align: center;
            color: #8994a5;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 480px) {
            .password-card {
                padding: 25px 20px;
            }

            .school-brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="password-container">

        <div class="school-brand">
            <h1>MACOAC<span>.</span></h1>
            <p>School Management Portal</p>
        </div>

        <div class="password-card">

            <div class="card-icon">🔐</div>

            <h2>Change Password</h2>

            <p class="description">
                Update your account password to keep your information
                secure. Enter your current password and choose a new one.
            </p>

            <form method="POST" action="{{ url_for('change_password') }}">

                <div class="form-group">
                    <label for="current_password">
                        Current Password
                    </label>

                    <input type="password"
                           id="current_password"
                           name="current_password"
                           placeholder="Enter your current password"
                           required>
                </div>

                <div class="form-group">
                    <label for="new_password">
                        New Password
                    </label>

                    <input type="password"
                           id="new_password"
                           name="new_password"
                           placeholder="Enter your new password"
                           required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">
                        Confirm New Password
                    </label>

                    <input type="password"
                           id="confirm_password"
                           name="confirm_password"
                           placeholder="Confirm your new password"
                           required>
                </div>

                <button type="submit" class="submit-button">
                    Change Password
                </button>

            </form>

            <a href="{{ url_for('dashboard') }}" class="back-link">
                ← Back to Dashboard
            </a>

            <p class="security-note">
                🔒 Your account security matters to MACOAC.
            </p>

        </div>

    </div>

</body>
</html>
